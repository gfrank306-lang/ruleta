<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruleta 5S</title>
<style>
body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
#stage{position:relative;width:98vw;height:98vw;max-width:560px;max-height:560px}
.ring{position:absolute;left:50%;top:50%;width:100%;height:100%;transform:translate(-50%,-50%);border-radius:50%;touch-action:none}
#blueWrap{width:100%;height:100%;z-index:1}
#redWrap{width:66%;height:66%;z-index:2}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:39%;height:43%;z-index:10;background:linear-gradient(180deg,#fff9a0 0%,#ffde00 30%,#ffb100 100%);clip-path:polygon(50% 0%,94% 35%,78% 100%,22% 100%,6% 35%);border:3px solid #ffea00;box-shadow:0 0 18px gold;display:flex;flex-direction:column;align-items:center;justify-content:center}
#center b{font-family:Arial Black;font-size:12px;color:#000}
#center select{width:90%;background:#000;color:#fff;border-radius:10px;padding:6px 2px;font-weight:900;font-size:11px;text-align:center;margin:3px 0}
</style>
</head>
<body>
<div id="stage">
<div id="blueWrap" class="ring">
<svg viewBox="0 0 500 500" width="100%" height="100%">
<defs><radialGradient id="bG" cx="50%" cy="40%"><stop offset="0%" stop-color="#2a7bff"/><stop offset="100%" stop-color="#001a66"/></radialGradient></defs>
<circle cx="250" cy="250" r="244" fill="none" stroke="#00bfff" stroke-width="7" opacity="0.9"/>
<circle cx="250" cy="250" r="216" fill="url(#bG)"/>
<g id="bLabels"></g>
</svg>
</div>
<div id="redWrap" class="ring">
<svg viewBox="0 0 340 340" width="100%" height="100%">
<circle cx="170" cy="170" r="160" fill="none" stroke="#ff0000" stroke-width="6"/>
<circle cx="170" cy="170" r="135" fill="#8b0000"/>
<g id="rLabels"></g>
</svg>
</div>
<div id="center"><b>📅 Día:</b><select id="dia"><option>Selecciona un día</option></select><b>📅 Mes:</b><select id="mes"><option>Selecciona un mes</option></select></div>
</div>
<script>
const blue=["Vale","Monz","Fer","Omar","Tony"], red=["Traspaleo","Polipasto 1","Palletizado","Mapas","Polipasto 2"];
function add(id,names,isBlue){
const g=document.getElementById(id),cx=isBlue?250:170,r=isBlue?180:108;
names.forEach((n,i)=>{
const ang=i*360/names.length-90,rad=ang*Math.PI/180,x=cx+r*Math.cos(rad),y=cx+r*Math.sin(rad);
const t=document.createElementNS("http://www.w3.org/2000/svg","text");
t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("text-anchor","middle");t.setAttribute("dominant-baseline","middle");
t.setAttribute("transform",`rotate(${ang+90} ${x} ${y})`);
t.setAttribute("style",isBlue?`font-family:Arial Black;font-size:${n.length>4?34:40}px;fill:#e6f7ff;stroke:#002060;stroke-width:3.2px;paint-order:stroke;`:`font-family:Arial Black;font-size:22px;fill:#fff;stroke:#500;stroke-width:2px;paint-order:stroke;`);
t.textContent=n;g.appendChild(t);
const tr=document.createElementNS("http://www.w3.org/2000/svg","path");
const rr=isBlue?r-26:r-20,tx=cx+rr*Math.cos(rad),ty=cx+rr*Math.sin(rad);
tr.setAttribute("d",`M ${tx-10} ${ty-8} L ${tx+10} ${ty-8} L ${tx} ${ty+8} Z`);
tr.setAttribute("fill",isBlue?"#00d0ff":"#ff1a1a");tr.setAttribute("stroke","#000");tr.setAttribute("stroke-width","1");
tr.setAttribute("transform",`rotate(${ang+90} ${tx} ${ty})`);g.appendChild(tr);
});
}
add("bLabels",blue,true);add("rLabels",red,false);
function spin(el){let a=0,sa=0,s=0,d=false;const ga=e=>{const rc=el.getBoundingClientRect(),cx=rc.left+rc.width/2,cy=rc.top+rc.height/2,p=e.touches?e.touches[0]:e;return Math.atan2(p.clientY-cy,p.clientX-cx)*180/Math.PI;};const down=e=>{d=true;s=ga(e);sa=a;};const move=e=>{if(!d)return;e.preventDefault();a=sa+(ga(e)-s);el.style.transform=`translate(-50%,-50%) rotate(${a}deg)`;};el.addEventListener('touchstart',down,{passive:false});el.addEventListener('touchmove',move,{passive:false});el.addEventListener('touchend',()=>d=false);el.addEventListener('mousedown',down);window.addEventListener('mousemove',move);window.addEventListener('mouseup',()=>d=false);}
spin(document.getElementById('blueWrap'));spin(document.getElementById('redWrap'));
const dia=document.getElementById('dia'),mes=document.getElementById('mes');for(let i=1;i<=31;i++){let o=document.createElement('option');o.textContent=i;dia.appendChild(o);}["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"].forEach(m=>{let o=document.createElement('option');o.textContent=m;mes.appendChild(o);});
</script>
</body>
</html>
