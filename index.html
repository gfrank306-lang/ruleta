<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.ruleta{
    position:relative;
    width:min(96vw,760px);
    aspect-ratio:1;
    user-select:none;
    touch-action:none;
}

/* =========================
   ANILLO AZUL
========================= */
.azul{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:12px solid #00aaff;
    background:conic-gradient(
        #075cff 0deg 72deg,
        #0039a8 72deg 144deg,
        #075cff 144deg 216deg,
        #0039a8 216deg 288deg,
        #075cff 288deg 360deg
    );
    box-shadow:
        0 0 12px #00aaff,
        0 0 35px #0055ff,
        inset 0 0 30px #00aaff;
    cursor:grab;
    transition:box-shadow .2s;
}

.azul:active{
    cursor:grabbing;
}

/* =========================
   ANILLO ROJO
========================= */
.rojo{
    position:absolute;
    inset:15%;
    border-radius:50%;
    border:10px solid #ff1717;
    background:conic-gradient(
        #ff1010 0deg 72deg,
        #9b0000 72deg 144deg,
        #ff1010 144deg 216deg,
        #9b0000 216deg 288deg,
        #ff1010 288deg 360deg
    );
    box-shadow:
        0 0 15px #ff0000,
        0 0 35px #990000,
        inset 0 0 25px #ff5b00;
    cursor:grab;
}

.rojo:active{
    cursor:grabbing;
}

/* Divisiones */
.division{
    position:absolute;
    left:50%;
    top:0;
    width:4px;
    height:50%;
    background:#00184f;
    transform-origin:bottom center;
    box-shadow:0 0 5px #00baff;
}

.rojo .division{
    background:#510000;
    box-shadow:0 0 5px #ff5555;
}

/* Texto azul */
.texto-azul{
    position:absolute;
    left:50%;
    top:7%;
    transform:translateX(-50%);
    color:white;
    font-weight:900;
    font-size:clamp(25px,6vw,58px);
    white-space:nowrap;
    -webkit-text-stroke:5px #00144d;
    text-shadow:0 0 8px #00eaff;
}

/* Texto rojo */
.texto-rojo{
    position:absolute;
    left:50%;
    top:8%;
    transform:translateX(-50%);
    color:white;
    font-weight:900;
    font-size:clamp(18px,4vw,40px);
    white-space:nowrap;
    -webkit-text-stroke:4px #700000;
    text-shadow:0 0 8px #ff9999;
}

/* Posiciones de nombres */
.azul .a1{transform:rotate(0deg)}
.azul .a2{transform:rotate(72deg)}
.azul .a3{transform:rotate(144deg)}
.azul .a4{transform:rotate(216deg)}
.azul .a5{transform:rotate(288deg)}

.azul .a2 .texto-azul{transform:translateX(-50%) rotate(-72deg)}
.azul .a3 .texto-azul{transform:translateX(-50%) rotate(-144deg)}
.azul .a4 .texto-azul{transform:translateX(-50%) rotate(-216deg)}
.azul .a5 .texto-azul{transform:translateX(-50%) rotate(-288deg)}

.rojo .r1{transform:rotate(0deg)}
.rojo .r2{transform:rotate(72deg)}
.rojo .r3{transform:rotate(144deg)}
.rojo .r4{transform:rotate(216deg)}
.rojo .r5{transform:rotate(288deg)}

.rojo .r2 .texto-rojo{transform:translateX(-50%) rotate(-72deg)}
.rojo .r3 .texto-rojo{transform:translateX(-50%) rotate(-144deg)}
.rojo .r4 .texto-rojo{transform:translateX(-50%) rotate(-216deg)}
.rojo .r5 .texto-rojo{transform:translateX(-50%) rotate(-288deg)}

/* =========================
   PENTÁGONO CENTRAL FIJO
========================= */
.centro{
    position:absolute;
    z-index:20;
    inset:27%;
    display:flex;
    justify-content:center;
    align-items:center;
    pointer-events:none;
}

.pentagono{
    width:100%;
    height:100%;
    clip-path:polygon(
        50% 0%,
        98% 35%,
        80% 100%,
        20% 100%,
        2% 35%
    );
    background:linear-gradient(
        135deg,
        #fff94a,
        #ffd000 45%,
        #bd8500
    );
    box-shadow:
        0 0 20px #fff000,
        0 0 45px #ffbf00;
    padding:22% 12%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:15px;
    pointer-events:auto;
}

.campo label{
    display:block;
    text-align:center;
    color:white;
    font-size:clamp(18px,4vw,34px);
    font-weight:900;
    -webkit-text-stroke:3px #111;
    margin-bottom:5px;
}

select{
    width:100%;
    height:clamp(40px,7vw,60px);
    border:4px solid #000;
    border-radius:13px;
    background:#111;
    color:white;
    font-size:clamp(14px,2.5vw,23px);
    font-weight:bold;
    padding:0 10px;
    outline:none;
    cursor:pointer;
}

/* =========================
   FLECHAS FIJAS
========================= */
.flecha{
    position:absolute;
    z-index:30;
    font-size:clamp(30px,6vw,60px);
    color:#00eaff;
    -webkit-text-stroke:3px #00104c;
    text-shadow:0 0 10px #00cfff;
    pointer-events:none;
}

.arriba{
    top:14%;
    left:50%;
    transform:translateX(-50%);
}

.derecha{
    right:12%;
    top:50%;
    transform:translateY(-50%);
}

.abajo{
    bottom:14%;
    left:50%;
    transform:translateX(-50%);
}

.izquierda{
    left:12%;
    top:50%;
    transform:translateY(-50%);
}

@media(max-width:500px){
    .azul{border-width:7px}
    .rojo{border-width:6px}
}
</style>
</head>

<body>

<div class="ruleta">

    <!-- ANILLO AZUL -->
    <div class="azul" id="azul">

        <div class="division" style="transform:rotate(0deg)"></div>
        <div class="division" style="transform:rotate(72deg)"></div>
        <div class="division" style="transform:rotate(144deg)"></div>
        <div class="division" style="transform:rotate(216deg)"></div>
        <div class="division" style="transform:rotate(288deg)"></div>

        <div class="a1">
            <div class="texto-azul">Vale</div>
        </div>

        <div class="a2">
            <div class="texto-azul">Monz</div>
        </div>

        <div class="a3">
            <div class="texto-azul">Fer</div>
        </div>

        <div class="a4">
            <div class="texto-azul">Omar</div>
        </div>

        <div class="a5">
            <div class="texto-azul">Tony</div>
        </div>
    </div>


    <!-- ANILLO ROJO -->
    <div class="rojo" id="rojo">

        <div class="division" style="transform:rotate(0deg)"></div>
        <div class="division" style="transform:rotate(72deg)"></div>
        <div class="division" style="transform:rotate(144deg)"></div>
        <div class="division" style="transform:rotate(216deg)"></div>
        <div class="division" style="transform:rotate(288deg)"></div>

        <div class="r1">
            <div class="texto-rojo">Traspaleo</div>
        </div>

        <div class="r2">
            <div class="texto-rojo">Polipasto 1</div>
        </div>

        <div class="r3">
            <div class="texto-rojo">Palletizado</div>
        </div>

        <div class="r4">
            <div class="texto-rojo">Mapas</div>
        </div>

        <div class="r5">
            <div class="texto-rojo">Polipasto 2</div>
        </div>
    </div>


    <!-- CENTRO FIJO -->
    <div class="centro">
        <div class="pentagono">

            <div class="campo">
                <label>📅 Día:</label>
                <select id="dia">
                    <option value="">Selecciona un día</option>
                </select>
            </div>

            <div class="campo">
                <label>📅 Mes:</label>
                <select id="mes">
                    <option value="">Selecciona un mes</option>
                    <option>Enero</option>
                    <option>Febrero</option>
                    <option>Marzo</option>
                    <option>Abril</option>
                    <option>Mayo</option>
                    <option>Junio</option>
                    <option>Julio</option>
                    <option>Agosto</option>
                    <option>Septiembre</option>
                    <option>Octubre</option>
                    <option>Noviembre</option>
                    <option>Diciembre</option>
                </select>
            </div>

        </div>
    </div>


    <!-- INDICADORES FIJOS -->
    <div class="flecha arriba">▼</div>
    <div class="flecha derecha">◀</div>
    <div class="flecha abajo">▲</div>
    <div class="flecha izquierda">▶</div>

</div>


<script>

/* =========================
   DÍAS
========================= */

const dia = document.getElementById("dia");

for(let i=1;i<=31;i++){
    const opcion=document.createElement("option");
    opcion.value=i;
    opcion.textContent=i;
    dia.appendChild(opcion);
}


/* =========================
   GIRO MANUAL DE LOS ANILLOS
========================= */

function hacerGiratorio(elemento){

    let girando=false;
    let anguloInicial=0;
    let rotacion=0;

    function obtenerAngulo(x,y){

        const rect=elemento.getBoundingClientRect();

        const centroX=rect.left+rect.width/2;
        const centroY=rect.top+rect.height/2;

        return Math.atan2(
            y-centroY,
            x-centroX
        )*180/Math.PI;
    }

    function iniciar(x,y){

        girando=true;
        anguloInicial=obtenerAngulo(x,y);

        elemento.style.transition="none";
    }

    function mover(x,y){

        if(!girando)return;

        const anguloActual=obtenerAngulo(x,y);

        let diferencia=anguloActual-anguloInicial;

        if(diferencia>180)diferencia-=360;
        if(diferencia<-180)diferencia+=360;

        rotacion+=diferencia;
        anguloInicial=anguloActual;

        elemento.style.transform=`rotate(${rotacion}deg)`;
    }

    function terminar(){

        girando=false;
    }


    /* Mouse */

    elemento.addEventListener("mousedown",e=>{
        iniciar(e.clientX,e.clientY);
    });

    window.addEventListener("mousemove",e=>{
        mover(e.clientX,e.clientY);
    });

    window.addEventListener("mouseup",terminar);


    /* Celular / táctil */

    elemento.addEventListener("touchstart",e=>{
        const t=e.touches[0];
        iniciar(t.clientX,t.clientY);
    },{passive:true});

    window.addEventListener("touchmove",e=>{
        if(!girando)return;

        const t=e.touches[0];
        mover(t.clientX,t.clientY);

    },{passive:true});

    window.addEventListener("touchend",terminar);
}


/* Cada anillo se puede girar independientemente */

hacerGiratorio(document.getElementById("azul"));
hacerGiratorio(document.getElementById("rojo"));

</script>

</body>
</html>
