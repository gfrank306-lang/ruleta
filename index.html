<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruleta 5S</title><style>body{margin:0;background:#050505;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial Black;overflow:hidden}#wrap{position:relative;width:95vw;height:95vw;max-width:540px;max-height:540px}.ring{position:absolute;border-radius:50%;touch-action:none;left:50%;top:50%}#blue{width:100%;height:100%;transform:translate(-50%,-50%);background:conic-gradient(#002266 0 72deg,#0044cc 72deg 144deg,#1a5cff 144deg 216deg,#0044cc 216deg 288deg,#002266 288deg 360deg);border:5px solid #00d0ff;box-shadow:0 0 30px #00aaff;z-index:1}#red{width:62%;height:62%;transform:translate(-50%,-50%);background:conic-gradient(#440000 0 72deg,#990000 72deg 144deg,#e00000 144deg 216deg,#990000 216deg 288deg,#440000 288deg 360deg);border:4px solid #ff2222;box-shadow:0 0 20px red;z-index:2}.lb,.lr{position:absolute;left:50%;top:50%;white-space:nowrap;font-weight:900}.lb{font-size:28px;color:#cfffff;text-shadow:0 0 10px #00e5ff,2px 2px 0 #000}.lr{font-size:14px;color:#fff;text-shadow:0 0 8px red,2px 2px 0 #000}#pent{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48%;height:54%;background:linear-gradient(#fffbb0,#ffc400);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid gold;box-shadow:0 0 25px gold;color:#000;text-align:center;padding-top:10px}#pent select{width:92%;margin:3px 0;padding:5px;border-radius:8px;font-weight:bold;font-size:13px}#pent b{font-size:13px}</style></head><body><div id="wrap"><div id="blue" class="ring"></div><div id="red" class="ring"></div><div id="pent"><b>Día</b><select id="dia"><option>Selecciona</option></select><b>Mes</b><select id="mes"><option>Selecciona</option></select><div id="res" style="margin-top:6px;font-size:12px;background:#fff;padding:2px 6px;border-radius:6px">Gira</div></div></div><script>const blueN=["Vale","Monz","Fer","Omar","Tony"],redN=["Traspaleo","Polipasto 1","Palletizado","Mapas","Polipasto 2"];function place(cont,names,r,cls){names.forEach((t,i)=>{const d=document.createElement('div');d.className=cls;d.textContent=t;const deg=i*360/names.length;d.style.transform=`translate(-50%,-50%) rotate(${deg}deg) translateY(-${r}px) rotate(${-deg}deg)`;cont.appendChild(d);});}place(document.getElementById('blue'),blueN,190,'lb');place(document.getElementById('red'),redN,96,'lr');function makeRot(el){let ang=0,sa=0,st=0,drag=false;const getA=e=>{const rc=el.getBoundingClientRect(),cx=rc.left+rc.width/2,cy=rc.top+rc.height/2,p=e.touches?e.touches[0]:e;return Math.atan2(p.clientY-cy,p.clientX-cx)*180/Math.PI;};const down=e=>{drag=true;st=getA(e);sa=ang;el.style.transition='none';};const move=e=>{if(!drag)return;e.preventDefault();ang=sa+(getA(e)-st);el.style.transform=`translate(-50%,-50%) rotate(${ang}deg)`;update();};const up=()=>drag=false;el.addEventListener('touchstart',down,{passive:false});el.addEventListener('touchmove',move,{passive:false});el.addEventListener('touchend',up);el.addEventListener('mousedown',down);window.addEventListener('mousemove',move);window.addEventListener('mouseup',up);el._get=()=>ang;}const rb=makeRot(document.getElementById('blue')),rr=makeRot(document.getElementById('red'));const bEl=document.getElementById('blue'),rEl=document.getElementById('red');const dia=document.getElementById('dia'),mes=document.getElementById('mes');for(let i=1;i<=31;i++){let o=document.createElement('option');o.textContent=i;dia.appendChild(o);}["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"].forEach(m=>{let o=document.createElement('option');o.textContent=m;mes.appendChild(o);});function idx(a,c){let n=((a%360)+360)%360;return Math.floor(((360-n+270)%360)/(360/c))%c;}function update(){const bi=idx(bEl._get(),5),ri=idx(rEl._get(),5);document.getElementById('res').textContent=`${blueN[bi]} → ${redN[ri]}`;}update();</script></body></html>
