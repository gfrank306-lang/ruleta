<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#000;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
}

.ruleta{
    position:relative;
    width:min(96vw,760px);
    aspect-ratio:1;
}

/* =========================
   ANILLO AZUL
========================= */

.anillo-azul{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:10px solid #00bfff;
    background:
        conic-gradient(
            from -36deg,
            #075cff 0deg 72deg,
            #0038a8 72deg 144deg,
            #075cff 144deg 216deg,
            #0038a8 216deg 288deg,
            #075cff 288deg 360deg
        );
    box-shadow:
        0 0 12px #00bfff,
        0 0 30px #006eff,
        inset 0 0 25px #00aaff;
    cursor:grab;
    touch-action:none;
}

.anillo-azul:active{
    cursor:grabbing;
}

/* =========================
   ANILLO ROJO
========================= */

.anillo-rojo{
    position:absolute;
    inset:15%;
    border-radius:50%;
    border:9px solid #ff2020;
    background:
        conic-gradient(
            from -36deg,
            #ff1010 0deg 72deg,
            #a90000 72deg 144deg,
            #ff1010 144deg 216deg,
            #a90000 216deg 288deg,
            #ff1010 288deg 360deg
        );
    box-shadow:
        0 0 15px #ff0000,
        0 0 30px #a00000,
        inset 0 0 25px #ff5b00;
    cursor:grab;
    touch-action:none;
}

.anillo-rojo:active{
    cursor:grabbing;
}

/* =========================
   DIVISIONES
========================= */

.division{
    position:absolute;
    width:4px;
    height:50%;
    left:calc(50% - 2px);
    top:0;
    background:#00184d;
    transform-origin:50% 100%;
    pointer-events:none;
}

.anillo-rojo .division{
    background:#4d0000;
}

/* =========================
   TEXTOS
========================= */

.nombre{
    position:absolute;
    left:50%;
    top:6%;
    transform:translateX(-50%);
    white-space:nowrap;
    font-weight:900;
    color:white;
    text-align:center;
    pointer-events:none;
}

.azul-texto{
    font-size:clamp(24px,5.5vw,58px);
    -webkit-text-stroke:4px #001348;
    text-shadow:
        0 0 7px #00eaff,
        0 3px 3px #00184d;
}

.rojo-texto{
    font-size:clamp(17px,3.8vw,39px);
    -webkit-text-stroke:3px #650000;
    text-shadow:
        0 0 6px #ffaaaa,
        0 3px 3px #4d0000;
}

/*
Cada nombre está dentro de su propio sector.
El nombre gira con el sector pero permanece
orientado correctamente.
*/

.sector{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.sector-1{
    transform:rotate(0deg);
}

.sector-2{
    transform:rotate(72deg);
}

.sector-3{
    transform:rotate(144deg);
}

.sector-4{
    transform:rotate(216deg);
}

.sector-5{
    transform:rotate(288deg);
}

.sector-2 .nombre{
    transform:translateX(-50%) rotate(-72deg);
}

.sector-3 .nombre{
    transform:translateX(-50%) rotate(-144deg);
}

.sector-4 .nombre{
    transform:translateX(-50%) rotate(-216deg);
}

.sector-5 .nombre{
    transform:translateX(-50%) rotate(-288deg);
}

/* =========================
   CENTRO FIJO
========================= */

.centro{
    position:absolute;
    z-index:50;
    inset:27%;
    pointer-events:auto;
}

.pentagono{
    width:100%;
    height:100%;
    padding:19% 12% 17%;

    clip-path:polygon(
        50% 0%,
        98% 35%,
        80% 100%,
        20% 100%,
        2% 35%
    );

    background:
        linear-gradient(
            145deg,
            #fff82b 0%,
            #ffd000 45%,
            #c58a00 100%
        );

    box-shadow:
        0 0 15px #fff000,
        0 0 35px #ffb700;

    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:12%;
}

/* =========================
   CAMPOS
========================= */

.campo{
    width:100%;
}

.campo label{
    display:block;
    width:100%;
    text-align:center;
    color:white;
    font-size:clamp(19px,4vw,35px);
    font-weight:900;
    margin-bottom:5px;

    -webkit-text-stroke:3px #111;
    text-shadow:
        0 3px 2px #222;
}

select{
    display:block;
    width:100%;

    height:clamp(38px,6vw,58px);

    padding:0 30px 0 10px;

    border:4px solid #000;
    border-radius:14px;

    background:#111;
    color:white;

    font-size:clamp(13px,2.4vw,22px);
    font-weight:800;

    outline:none;
    cursor:pointer;

    appearance:auto;
}

select:focus{
    border-color:#fff000;
}

/* =========================
   FLECHAS FIJAS
========================= */

.flecha{
    position:absolute;
    z-index:70;

    color:#00eaff;

    font-size:clamp(30px,6vw,60px);
    line-height:1;

    -webkit-text-stroke:3px #00104d;
    text-shadow:0 0 10px #00cfff;

    pointer-events:none;
}

.flecha-arriba{
    top:13%;
    left:50%;
    transform:translateX(-50%);
}

.flecha-abajo{
    bottom:13%;
    left:50%;
    transform:translateX(-50%);
}

.flecha-izquierda{
    left:11%;
    top:50%;
    transform:translateY(-50%);
}

.flecha-derecha{
    right:11%;
    top:50%;
    transform:translateY(-50%);
}

/* =========================
   CELULAR
========================= */

@media(max-width:500px){

    .ruleta{
        width:96vw;
    }

    .anillo-azul{
        border-width:7px;
    }

    .anillo-rojo{
        border-width:6px;
    }

    .centro{
        inset:27%;
    }

    .pentagono{
        padding-left:11%;
        padding-right:11%;
    }

    .campo label{
        -webkit-text-stroke:2px #111;
    }

    select{
        border-width:3px;
        border-radius:10px;
    }
}
</style>
</head>

<body>

<div class="ruleta">

    <!-- =====================
         ANILLO AZUL
    ====================== -->

    <div class="anillo-azul" id="anilloAzul">

        <div class="division" style="transform:rotate(0deg)"></div>
        <div class="division" style="transform:rotate(72deg)"></div>
        <div class="division" style="transform:rotate(144deg)"></div>
        <div class="division" style="transform:rotate(216deg)"></div>
        <div class="division" style="transform:rotate(288deg)"></div>

        <div class="sector sector-1">
            <div class="nombre azul-texto">Vale</div>
        </div>

        <div class="sector sector-2">
            <div class="nombre azul-texto">Monz</div>
        </div>

        <div class="sector sector-3">
            <div class="nombre azul-texto">Fer</div>
        </div>

        <div class="sector sector-4">
            <div class="nombre azul-texto">Omar</div>
        </div>

        <div class="sector sector-5">
            <div class="nombre azul-texto">Tony</div>
        </div>

    </div>


    <!-- =====================
         ANILLO ROJO
    ====================== -->

    <div class="anillo-rojo" id="anilloRojo">

        <div class="division" style="transform:rotate(0deg)"></div>
        <div class="division" style="transform:rotate(72deg)"></div>
        <div class="division" style="transform:rotate(144deg)"></div>
        <div class="division" style="transform:rotate(216deg)"></div>
        <div class="division" style="transform:rotate(288deg)"></div>

        <div class="sector sector-1">
            <div class="nombre rojo-texto">Traspaleo</div>
        </div>

        <div class="sector sector-2">
            <div class="nombre rojo-texto">Polipasto 1</div>
        </div>

        <div class="sector sector-3">
            <div class="nombre rojo-texto">Palletizado</div>
        </div>

        <div class="sector sector-4">
            <div class="nombre rojo-texto">Mapas</div>
        </div>

        <div class="sector sector-5">
            <div class="nombre rojo-texto">Polipasto 2</div>
        </div>

    </div>


    <!-- =====================
         PENTÁGONO FIJO
    ====================== -->

    <div class="centro">

        <div class="pentagono">

            <div class="campo">
                <label for="dia">Día:</label>

                <select id="dia">
                    <option value="">Selecciona un día</option>
                </select>
            </div>


            <div class="campo">
                <label for="mes">Mes:</label>

                <select id="mes">

                    <option value="">Selecciona un mes</option>

                    <option>Enero</option>
                    <option>Febrero</option>
                    <option>Marzo</option>
                    <option>Abril</option>
                    <option>Mayo</option>
                    <option>Junio</option>
                    <option>Julio</option>
                    <option>Agosto</option>
                    <option>Septiembre</option>
                    <option>Octubre</option>
                    <option>Noviembre</option>
                    <option>Diciembre</option>

                </select>

            </div>

        </div>

    </div>


    <!-- =====================
         INDICADORES FIJOS
    ====================== -->

    <div class="flecha flecha-arriba">▼</div>
    <div class="flecha flecha-abajo">▲</div>
    <div class="flecha flecha-izquierda">▶</div>
    <div class="flecha flecha-derecha">◀</div>

</div>


<script>

/* =========================
   CREAR DÍAS
========================= */

const selectorDia = document.getElementById("dia");

for(let i = 1; i <= 31; i++){

    const opcion = document.createElement("option");

    opcion.value = i;
    opcion.textContent = i;

    selectorDia.appendChild(opcion);
}


/* =========================
   GIRO MANUAL
========================= */

function activarGiroManual(elemento){

    let activo = false;
    let ultimoAngulo = 0;
    let rotacion = 0;

    function obtenerAngulo(x,y){

        const rect = elemento.getBoundingClientRect();

        const centroX = rect.left + rect.width / 2;
        const centroY = rect.top + rect.height / 2;

        return Math.atan2(
            y - centroY,
            x - centroX
        ) * 180 / Math.PI;
    }


    function comenzar(x,y){

        activo = true;

        ultimoAngulo = obtenerAngulo(x,y);

        elemento.style.transition = "none";
    }


    function mover(x,y){

        if(!activo) return;

        const nuevoAngulo = obtenerAngulo(x,y);

        let diferencia = nuevoAngulo - ultimoAngulo;

        if(diferencia > 180){
            diferencia -= 360;
        }

        if(diferencia < -180){
            diferencia += 360;
        }

        rotacion += diferencia;

        ultimoAngulo = nuevoAngulo;

        elemento.style.transform =
            "rotate(" + rotacion + "deg)";
    }


    function terminar(){

        activo = false;
    }


    /* Mouse */

    elemento.addEventListener("mousedown",function(e){

        comenzar(
            e.clientX,
            e.clientY
        );

    });


    window.addEventListener("mousemove",function(e){

        mover(
            e.clientX,
            e.clientY
        );

    });


    window.addEventListener("mouseup",terminar);


    /* Pantalla táctil */

    elemento.addEventListener("touchstart",function(e){

        const toque = e.touches[0];

        comenzar(
            toque.clientX,
            toque.clientY
        );

    },{passive:true});


    window.addEventListener("touchmove",function(e){

        if(!activo) return;

        const toque = e.touches[0];

        mover(
            toque.clientX,
            toque.clientY
        );

    },{passive:true});


    window.addEventListener("touchend",terminar);

}


/* =========================
   ACTIVAR LOS DOS ANILLOS
========================= */

activarGiroManual(
    document.getElementById("anilloAzul")
);

activarGiroManual(
    document.getElementById("anilloRojo")
);

</script>

</body>
</html>
