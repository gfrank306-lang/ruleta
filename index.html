<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

.ruleta{
    position:relative;
    width:min(96vw,760px);
    aspect-ratio:1;
}


/* =====================================================
   ANILLO AZUL
===================================================== */

.anillo-azul{
    position:absolute;
    inset:0;
    border-radius:50%;

    border:10px solid #00c8ff;

    background:
    conic-gradient(
        from -36deg,
        #075cff 0deg 72deg,
        #0039ad 72deg 144deg,
        #075cff 144deg 216deg,
        #0039ad 216deg 288deg,
        #075cff 288deg 360deg
    );

    box-shadow:
        0 0 12px #00cfff,
        0 0 30px #006eff,
        0 0 55px #004cff,
        inset 0 0 25px #00aaff;

    cursor:grab;
    touch-action:none;
    z-index:1;
}

.anillo-azul:active{
    cursor:grabbing;
}


/* =====================================================
   ANILLO ROJO
===================================================== */

.anillo-rojo{
    position:absolute;
    inset:15%;
    border-radius:50%;

    border:9px solid #ff1717;

    background:
    conic-gradient(
        from -36deg,
        #ff1010 0deg 72deg,
        #a90000 72deg 144deg,
        #ff1010 144deg 216deg,
        #a90000 216deg 288deg,
        #ff1010 288deg 360deg
    );

    box-shadow:
        0 0 12px #ff0000,
        0 0 28px #e00000,
        0 0 45px #8d0000,
        inset 0 0 25px #ff5500;

    cursor:grab;
    touch-action:none;
    z-index:5;
}

.anillo-rojo:active{
    cursor:grabbing;
}


/* =====================================================
   DIVISIONES
===================================================== */

.division{
    position:absolute;
    width:4px;
    height:50%;
    left:calc(50% - 2px);
    top:0;
    transform-origin:50% 100%;
    pointer-events:none;
}

.azul-division{
    background:#00184f;
    box-shadow:0 0 5px #00bfff;
}

.rojo-division{
    background:#520000;
    box-shadow:0 0 5px #ff3333;
}


/* =====================================================
   SISTEMA DE NOMBRES
   Cada nombre tiene su propio sector.
===================================================== */

.sector{
    position:absolute;
    inset:0;
    pointer-events:none;
}


/* =====================================================
   NOMBRES AZULES
===================================================== */

.nombre-azul{
    position:absolute;

    top:7%;
    left:50%;

    transform:
        translateX(-50%);

    white-space:nowrap;

    color:white;

    font-size:clamp(25px,5.5vw,58px);

    font-weight:900;

    -webkit-text-stroke:
        clamp(2px,.5vw,5px)
        #00133f;

    text-shadow:
        0 0 6px #00eaff,
        0 0 12px #00aaff,
        0 4px 3px #00184d;

    text-align:center;
}


/* =====================================================
   NOMBRES ROJOS
===================================================== */

.nombre-rojo{
    position:absolute;

    top:8%;
    left:50%;

    transform:
        translateX(-50%);

    white-space:nowrap;

    color:white;

    font-size:clamp(17px,3.7vw,39px);

    font-weight:900;

    -webkit-text-stroke:
        clamp(2px,.4vw,4px)
        #650000;

    text-shadow:
        0 0 5px #ffaaaa,
        0 0 10px #ff2222,
        0 4px 3px #500000;

    text-align:center;
}


/* =====================================================
   ROTACIÓN DE CADA SECTOR AZUL
===================================================== */

.azul1{
    transform:rotate(0deg);
}

.azul2{
    transform:rotate(72deg);
}

.azul3{
    transform:rotate(144deg);
}

.azul4{
    transform:rotate(216deg);
}

.azul5{
    transform:rotate(288deg);
}


/* Mantener texto derecho */

.azul2 .nombre-azul{
    transform:translateX(-50%) rotate(-72deg);
}

.azul3 .nombre-azul{
    transform:translateX(-50%) rotate(-144deg);
}

.azul4 .nombre-azul{
    transform:translateX(-50%) rotate(-216deg);
}

.azul5 .nombre-azul{
    transform:translateX(-50%) rotate(-288deg);
}


/* =====================================================
   ROTACIÓN DE CADA SECTOR ROJO
===================================================== */

.rojo1{
    transform:rotate(0deg);
}

.rojo2{
    transform:rotate(72deg);
}

.rojo3{
    transform:rotate(144deg);
}

.rojo4{
    transform:rotate(216deg);
}

.rojo5{
    transform:rotate(288deg);
}


/* Mantener texto derecho */

.rojo2 .nombre-rojo{
    transform:translateX(-50%) rotate(-72deg);
}

.rojo3 .nombre-rojo{
    transform:translateX(-50%) rotate(-144deg);
}

.rojo4 .nombre-rojo{
    transform:translateX(-50%) rotate(-216deg);
}

.rojo5 .nombre-rojo{
    transform:translateX(-50%) rotate(-288deg);
}


/* =====================================================
   CENTRO FIJO
===================================================== */

.centro{
    position:absolute;

    inset:27%;

    z-index:100;

    pointer-events:auto;

    display:flex;
    justify-content:center;
    align-items:center;
}


.pentagono{
    width:100%;
    height:100%;

    clip-path:
    polygon(
        50% 0%,
        98% 35%,
        80% 100%,
        20% 100%,
        2% 35%
    );

    background:
    linear-gradient(
        145deg,
        #fff82d 0%,
        #ffd000 48%,
        #c48800 100%
    );

    padding:
        18%
        10%
        15%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    gap:8%;
}


/* =====================================================
   ETIQUETAS
===================================================== */

.campo{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.campo label{
    color:white;

    font-size:clamp(
        19px,
        4vw,
        34px
    );

    font-weight:900;

    margin-bottom:5px;

    -webkit-text-stroke:2px #111;

    text-shadow:
        0 3px 2px #222;
}


/* =====================================================
   SELECT DEL DÍA
   PEQUEÑO, SOLO PARA EL NÚMERO
===================================================== */

#dia{

    width:75px;

    height:42px;

    padding:0 5px;

    border:4px solid #000;

    border-radius:12px;

    background:#111;

    color:white;

    font-size:20px;

    font-weight:900;

    text-align:center;

    outline:none;

    cursor:pointer;
}


/* =====================================================
   SELECT DEL MES
===================================================== */

#mes{

    width:125px;

    height:42px;

    padding:0 5px;

    border:4px solid #000;

    border-radius:12px;

    background:#111;

    color:white;

    font-size:16px;

    font-weight:900;

    text-align:center;

    outline:none;

    cursor:pointer;
}


#dia:focus,
#mes:focus{
    border-color:#fff000;
}


/* =====================================================
   FLECHAS FIJAS
===================================================== */

.flecha{
    position:absolute;

    z-index:150;

    color:#00eaff;

    font-size:clamp(
        30px,
        6vw,
        60px
    );

    line-height:1;

    -webkit-text-stroke:3px #00104d;

    text-shadow:
        0 0 10px #00cfff;

    pointer-events:none;
}

.arriba{
    top:13%;
    left:50%;
    transform:translateX(-50%);
}

.abajo{
    bottom:13%;
    left:50%;
    transform:translateX(-50%);
}

.izquierda{
    left:11%;
    top:50%;
    transform:translateY(-50%);
}

.derecha{
    right:11%;
    top:50%;
    transform:translateY(-50%);
}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:500px){

    .ruleta{
        width:96vw;
    }

    .anillo-azul{
        border-width:7px;
    }

    .anillo-rojo{
        border-width:6px;
    }

    .centro{
        inset:27%;
    }

    .pentagono{
        padding-left:9%;
        padding-right:9%;
    }

    .nombre-azul{
        font-size:25px;
    }

    .nombre-rojo{
        font-size:17px;
    }

    .campo label{
        font-size:19px;
    }

    #dia{
        width:68px;
        height:38px;
        font-size:18px;
    }

    #mes{
        width:105px;
        height:38px;
        font-size:14px;
    }

}


/* =====================================================
   CELULARES MUY PEQUEÑOS
===================================================== */

@media(max-width:360px){

    .nombre-azul{
        font-size:22px;
    }

    .nombre-rojo{
        font-size:15px;
    }

    #dia{
        width:62px;
        height:35px;
    }

    #mes{
        width:95px;
        height:35px;
        font-size:13px;
    }

}

</style>
</head>


<body>


<div class="ruleta">


    <!-- ==========================================
         ANILLO AZUL
    =========================================== -->

    <div class="anillo-azul" id="anilloAzul">

        <div class="division azul-division"
             style="transform:rotate(0deg)">
        </div>

        <div class="division azul-division"
             style="transform:rotate(72deg)">
        </div>

        <div class="division azul-division"
             style="transform:rotate(144deg)">
        </div>

        <div class="division azul-division"
             style="transform:rotate(216deg)">
        </div>

        <div class="division azul-division"
             style="transform:rotate(288deg)">
        </div>


        <!-- VALE -->

        <div class="sector azul1">
            <div class="nombre-azul">
                Vale
            </div>
        </div>


        <!-- MONZ -->

        <div class="sector azul2">
            <div class="nombre-azul">
                Monz
            </div>
        </div>


        <!-- FER -->

        <div class="sector azul3">
            <div class="nombre-azul">
                Fer
            </div>
        </div>


        <!-- OMAR -->

        <div class="sector azul4">
            <div class="nombre-azul">
                Omar
            </div>
        </div>


        <!-- TONY -->

        <div class="sector azul5">
            <div class="nombre-azul">
                Tony
            </div>
        </div>

    </div>



    <!-- ==========================================
         ANILLO ROJO
    =========================================== -->

    <div class="anillo-rojo" id="anilloRojo">


        <div class="division rojo-division"
             style="transform:rotate(0deg)">
        </div>

        <div class="division rojo-division"
             style="transform:rotate(72deg)">
        </div>

        <div class="division rojo-division"
             style="transform:rotate(144deg)">
        </div>

        <div class="division rojo-division"
             style="transform:rotate(216deg)">
        </div>

        <div class="division rojo-division"
             style="transform:rotate(288deg)">
        </div>


        <!-- TRASPALEO -->

        <div class="sector rojo1">
            <div class="nombre-rojo">
                Traspaleo
            </div>
        </div>


        <!-- POLIPASTO 1 -->

        <div class="sector rojo2">
            <div class="nombre-rojo">
                Polipasto 1
            </div>
        </div>


        <!-- PALLETIZADO -->

        <div class="sector rojo3">
            <div class="nombre-rojo">
                Palletizado
            </div>
        </div>


        <!-- MAPAS -->

        <div class="sector rojo4">
            <div class="nombre-rojo">
                Mapas
            </div>
        </div>


        <!-- POLIPASTO 2 -->

        <div class="sector rojo5">
            <div class="nombre-rojo">
                Polipasto 2
            </div>
        </div>

    </div>



    <!-- ==========================================
         CENTRO FIJO
    =========================================== -->

    <div class="centro">

        <div class="pentagono">


            <!-- DÍA -->

            <div class="campo">

                <label>Día:</label>

                <select id="dia">

                    <option value="" selected disabled hidden></option>

                </select>

            </div>


            <!-- MES -->

            <div class="campo">

                <label>Mes:</label>

                <select id="mes">

                    <option value="" selected disabled hidden></option>

                    <option>Enero</option>
                    <option>Febrero</option>
                    <option>Marzo</option>
                    <option>Abril</option>
                    <option>Mayo</option>
                    <option>Junio</option>
                    <option>Julio</option>
                    <option>Agosto</option>
                    <option>Septiembre</option>
                    <option>Octubre</option>
                    <option>Noviembre</option>
                    <option>Diciembre</option>

                </select>

            </div>

        </div>

    </div>



    <!-- ==========================================
         FLECHAS
    =========================================== -->

    <div class="flecha arriba">▼</div>

    <div class="flecha abajo">▲</div>

    <div class="flecha izquierda">▶</div>

    <div class="flecha derecha">◀</div>


</div>



<script>


/* =====================================================
   DÍAS 1 - 31
===================================================== */

const dia =
    document.getElementById("dia");

for(let i=1;i<=31;i++){

    const opcion =
        document.createElement("option");

    opcion.value=i;
    opcion.textContent=i;

    dia.appendChild(opcion);

}


/* =====================================================
   GIRO MANUAL
===================================================== */

function activarGiro(elemento){

    let girando=false;

    let anguloAnterior=0;

    let rotacion=0;


    function obtenerAngulo(x,y){

        const rect =
            elemento.getBoundingClientRect();

        const cx =
            rect.left +
            rect.width/2;

        const cy =
            rect.top +
            rect.height/2;

        return Math.atan2(
            y-cy,
            x-cx
        ) * 180 / Math.PI;

    }


    function iniciar(x,y){

        girando=true;

        anguloAnterior =
            obtenerAngulo(x,y);

    }


    function mover(x,y){

        if(!girando)return;

        const nuevo =
            obtenerAngulo(x,y);

        let diferencia =
            nuevo -
            anguloAnterior;


        if(diferencia>180){
            diferencia-=360;
        }

        if(diferencia<-180){
            diferencia+=360;
        }


        rotacion += diferencia;

        anguloAnterior=nuevo;


        elemento.style.transform =
            "rotate("+
            rotacion+
            "deg)";

    }


    function terminar(){

        girando=false;

    }


    /* MOUSE */

    elemento.addEventListener(
        "mousedown",
        function(e){

            e.preventDefault();

            iniciar(
                e.clientX,
                e.clientY
            );

        }
    );


    window.addEventListener(
        "mousemove",
        function(e){

            mover(
                e.clientX,
                e.clientY
            );

        }
    );


    window.addEventListener(
        "mouseup",
        terminar
    );


    /* TOUCH */

    elemento.addEventListener(
        "touchstart",
        function(e){

            const t =
                e.touches[0];

            iniciar(
                t.clientX,
                t.clientY
            );

        },
        {passive:true}
    );


    window.addEventListener(
        "touchmove",
        function(e){

            if(!girando)return;

            const t =
                e.touches[0];

            mover(
                t.clientX,
                t.clientY
            );

        },
        {passive:true}
    );


    window.addEventListener(
        "touchend",
        terminar
    );

}


/* =====================================================
   ACTIVAR LOS DOS ANILLOS
===================================================== */

activarGiro(
    document.getElementById("anilloAzul")
);

activarGiro(
    document.getElementById("anilloRojo")
);

</script>

</body>
</html>
