<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruleta 5S</title>
<style>
body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh}
#stage{position:relative;width:98vw;height:98vw;max-width:580px;max-height:580px;touch-action:none}
.ring{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
#blue{background:url('blue.png') center/contain no-repeat;z-index:1}
#redWrap{position:absolute;left:17%;top:17%;width:66%;height:66%;z-index:2;touch-action:none}
#red{background:url('red.png') center/contain no-repeat;width:100%;height:100%}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40%;height:44%;z-index:10;background:linear-gradient(180deg,#fff7a0 0%,#ffd400 40%,#ffb300 100%);clip-path:polygon(50% 0%,95% 35%,80% 100%,20% 100%,5% 35%);border:3px solid #ffea00;box-shadow:0 0 20px gold,inset 0 0 10px #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto}
#center b{font-family:Arial Black;font-size:12px;color:#000}
#center select{width:92%;background:#000;color:#fff;border-radius:10px;padding:6px 2px;font-weight:900;font-size:11px;text-align:center;margin:3px 0}
</style>
</head>
<body>
<div id="stage">
  <div id="blue" class="ring"></div>
  <div id="redWrap"><div id="red"></div></div>
  <div id="center">
    <b>📅 Día:</b><select id="dia"><option>Selecciona un día</option></select>
    <b>📅 Mes:</b><select id="mes"><option>Selecciona un mes</option></select>
  </div>
</div>
<script>
function makeSpin(el){
  let ang=0,startAng=0,startMouse=0,drag=false;
  function getAngle(e){
    const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,p=e.touches?e.touches[0]:e;
    return Math.atan2(p.clientY-cy,p.clientX-cx)*180/Math.PI;
  }
  function down(e){drag=true;startMouse=getAngle(e);startAng=ang;}
  function move(e){
    if(!drag)return;
    e.preventDefault();
    ang=startAng+(getAngle(e)-startMouse);
    el.style.transform=`rotate(${ang}deg)`;
  }
  el.addEventListener('touchstart',down,{passive:false});
  el.addEventListener('touchmove',move,{passive:false});
  el.addEventListener('touchend',()=>drag=false);
  el.addEventListener('mousedown',down);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',()=>drag=false);
}
makeSpin(document.getElementById('blue'));
makeSpin(document.getElementById('red'));

// llenar dias y meses
const dia=document.getElementById('dia'),mes=document.getElementById('mes');
for(let i=1;i<=31;i++){let o=document.createElement('option');o.textContent=i;dia.appendChild(o);}
["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"].forEach(m=>{let o=document.createElement('option');o.textContent=m;mes.appendChild(o);});
</script>
</body>
</html>
