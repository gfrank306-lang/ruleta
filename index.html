<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Ruleta 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,Helvetica,sans-serif;
}

#ruleta{
    position:relative;
    width:min(96vw,760px);
    aspect-ratio:1;
    perspective:1200px;
}

/* =====================================================
   RUEDA GENERAL
===================================================== */

.rueda{
    position:absolute;
    inset:0;
    transform:rotateX(5deg);
    transform-style:preserve-3d;
}

/* =====================================================
   ANILLO AZUL
===================================================== */

#azul{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;

    cursor:grab;
    touch-action:none;

    filter:
        drop-shadow(0 0 7px #00cfff)
        drop-shadow(0 0 22px #006cff);
}

#azul:active{
    cursor:grabbing;
}

/* =====================================================
   ANILLO ROJO
===================================================== */

#rojo{
    position:absolute;
    inset:14%;
    width:72%;
    height:72%;
    z-index:5;

    cursor:grab;
    touch-action:none;

    filter:
        drop-shadow(0 0 7px #ff0000)
        drop-shadow(0 0 18px #c90000);
}

#rojo:active{
    cursor:grabbing;
}

/* =====================================================
   CENTRO
===================================================== */

#centro{
    position:absolute;
    z-index:50;

    left:50%;
    top:50%;

    width:39%;
    height:39%;

    transform:translate(-50%,-50%);

    display:flex;
    align-items:center;
    justify-content:center;

    pointer-events:auto;
}

/* pentágono */

.pentagono{
    width:100%;
    height:100%;

    clip-path:polygon(
        50% 0%,
        98% 35%,
        80% 100%,
        20% 100%,
        2% 35%
    );

    background:
        linear-gradient(
            145deg,
            #fff92c 0%,
            #ffd400 35%,
            #ffbf00 65%,
            #c88700 100%
        );

    border:5px solid #ffe900;

    box-shadow:
        inset 0 0 20px #fff700,
        inset 0 -15px 20px #9d6200,
        0 0 12px #ffe000,
        0 0 30px #ffb700;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:18% 10% 13%;
}

/* brillo */

.pentagono::before{
    content:"";
    position:absolute;
    width:70%;
    height:20%;
    top:10%;
    left:15%;

    background:linear-gradient(
        rgba(255,255,255,.35),
        transparent
    );

    transform:skewY(-10deg);
    pointer-events:none;
}

/* =====================================================
   CAMPOS
===================================================== */

.campo{
    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;

    margin:2% 0;
}

.campo label{
    color:white;

    font-size:clamp(
        19px,
        4vw,
        36px
    );

    font-weight:900;

    margin-bottom:5px;

    -webkit-text-stroke:2px #111;

    text-shadow:
        2px 3px 0 #333,
        0 0 5px white;

    line-height:1;
}

/* =====================================================
   SELECT DÍA
===================================================== */

select{
    appearance:none;
    -webkit-appearance:none;

    background:
        linear-gradient(
            #171717,
            #090909
        );

    color:white;

    border:4px solid #000;

    box-shadow:
        inset 0 0 5px #444,
        0 0 0 2px #ffd900;

    border-radius:13px;

    font-weight:900;

    text-align:center;

    outline:none;

    cursor:pointer;
}

#dia{
    width:76px;
    height:45px;

    font-size:21px;
}

/* =====================================================
   SELECT MES
===================================================== */

#mes{
    width:125px;
    height:45px;

    font-size:16px;
}

select:focus{
    box-shadow:
        inset 0 0 5px #555,
        0 0 0 2px #fff200,
        0 0 10px #ffd900;
}

/* =====================================================
   FLECHAS
===================================================== */

.flecha{
    position:absolute;
    z-index:70;

    color:#00eaff;

    font-size:clamp(
        28px,
        5vw,
        58px
    );

    line-height:1;

    -webkit-text-stroke:
        3px #001047;

    filter:
        drop-shadow(0 0 5px #00d9ff)
        drop-shadow(0 0 12px #008cff);

    pointer-events:none;
}

.arriba{
    top:10%;
    left:50%;
    transform:translateX(-50%);
}

.abajo{
    bottom:10%;
    left:50%;
    transform:translateX(-50%);
}

.izquierda{
    left:7%;
    top:50%;
    transform:translateY(-50%);
}

.derecha{
    right:7%;
    top:50%;
    transform:translateY(-50%);
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:500px){

    #rojo{
        inset:15%;
        width:70%;
        height:70%;
    }

    #centro{
        width:40%;
        height:40%;
    }

    .campo label{
        font-size:20px;
    }

    #dia{
        width:70px;
        height:42px;
        font-size:20px;
    }

    #mes{
        width:112px;
        height:42px;
        font-size:14px;
    }
}
</style>
</head>

<body>

<div id="ruleta">

<div class="rueda">

<!-- ==================================================
     ANILLO AZUL
=================================================== -->

<svg id="azul"
     viewBox="0 0 1000 1000"
     xmlns="http://www.w3.org/2000/svg">

<defs>

    <radialGradient id="azulFondo">
        <stop offset="0%" stop-color="#267cff"/>
        <stop offset="55%" stop-color="#075ce8"/>
        <stop offset="100%" stop-color="#00227f"/>
    </radialGradient>

    <linearGradient id="azulBrillo"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">

        <stop offset="0%" stop-color="#3ea8ff"/>
        <stop offset="35%" stop-color="#0969ff"/>
        <stop offset="70%" stop-color="#0344c8"/>
        <stop offset="100%" stop-color="#001b78"/>

    </linearGradient>

    <filter id="brilloAzul">
        <feGaussianBlur
            stdDeviation="8"
            result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <filter id="texto3d">
        <feGaussianBlur
            in="SourceAlpha"
            stdDeviation="3"
            result="blur"/>

        <feOffset
            dx="4"
            dy="6"
            result="offset"/>

        <feFlood
            flood-color="#00123f"/>

        <feComposite
            in2="offset"
            operator="in"/>

        <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

</defs>


<!-- borde exterior -->

<circle
    cx="500"
    cy="500"
    r="482"
    fill="none"
    stroke="#00d9ff"
    stroke-width="22"
    filter="url(#brilloAzul)"/>

<circle
    cx="500"
    cy="500"
    r="461"
    fill="url(#azulFondo)"
    stroke="#005eff"
    stroke-width="8"/>


<!-- sectores -->

<path
    d="M500 500 L500 39 A461 461 0 0 1 938 365 Z"
    fill="url(#azulBrillo)"
    stroke="#00174e"
    stroke-width="7"/>

<path
    d="M500 500 L938 365 A461 461 0 0 1 770 873 Z"
    fill="url(#azulFondo)"
    stroke="#00174e"
    stroke-width="7"/>

<path
    d="M500 500 L770 873 A461 461 0 0 1 230 873 Z"
    fill="url(#azulBrillo)"
    stroke="#00174e"
    stroke-width="7"/>

<path
    d="M500 500 L230 873 A461 461 0 0 1 62 365 Z"
    fill="url(#azulFondo)"
    stroke="#00174e"
    stroke-width="7"/>

<path
    d="M500 500 L62 365 A461 461 0 0 1 500 39 Z"
    fill="url(#azulBrillo)"
    stroke="#00174e"
    stroke-width="7"/>


<!-- nombres -->

<g
    fill="#fff"
    font-family="Arial Black,Arial"
    font-weight="900"
    font-size="78"
    stroke="#00143e"
    stroke-width="14"
    paint-order="stroke"
    filter="url(#texto3d)"
    text-anchor="middle">

    <!-- VALE -->
    <text x="500" y="155">
        Vale
    </text>

    <!-- MONZ -->
    <text
        x="820"
        y="440"
        transform="rotate(72 820 440)">
        Monz
    </text>

    <!-- FER -->
    <text
        x="720"
        y="825"
        transform="rotate(-45 720 825)">
        Fer
    </text>

    <!-- OMAR -->
    <text
        x="280"
        y="825"
        transform="rotate(45 280 825)">
        Omar
    </text>

    <!-- TONY -->
    <text
        x="180"
        y="440"
        transform="rotate(-72 180 440)">
        Tony
    </text>

</g>

</svg>


<!-- ==================================================
     ANILLO ROJO
=================================================== -->

<svg id="rojo"
     viewBox="0 0 1000 1000"
     xmlns="http://www.w3.org/2000/svg">

<defs>

<radialGradient id="rojoFondo">

    <stop offset="0%" stop-color="#ff3b22"/>
    <stop offset="55%" stop-color="#ed0808"/>
    <stop offset="100%" stop-color="#820000"/>

</radialGradient>

<linearGradient id="rojoBrillo"
                x1="0"
                y1="0"
                x2="0"
                y2="1">

    <stop offset="0%" stop-color="#ff4b3a"/>
    <stop offset="40%" stop-color="#ff1616"/>
    <stop offset="75%" stop-color="#ce0000"/>
    <stop offset="100%" stop-color="#710000"/>

</linearGradient>

</defs>


<!-- borde -->

<circle
    cx="500"
    cy="500"
    r="455"
    fill="none"
    stroke="#ff1616"
    stroke-width="25"/>

<circle
    cx="500"
    cy="500"
    r="435"
    fill="url(#rojoFondo)"
    stroke="#8c0000"
    stroke-width="8"/>


<!-- sectores rojos -->

<path
    d="M500 500 L500 65 A435 435 0 0 1 914 365 Z"
    fill="url(#rojoBrillo)"
    stroke="#560000"
    stroke-width="8"/>

<path
    d="M500 500 L914 365 A435 435 0 0 1 755 852 Z"
    fill="url(#rojoFondo)"
    stroke="#560000"
    stroke-width="8"/>

<path
    d="M500 500 L755 852 A435 435 0 0 1 245 852 Z"
    fill="url(#rojoBrillo)"
    stroke="#560000"
    stroke-width="8"/>

<path
    d="M500 500 L245 852 A435 435 0 0 1 86 365 Z"
    fill="url(#rojoFondo)"
    stroke="#560000"
    stroke-width="8"/>

<path
    d="M500 500 L86 365 A435 435 0 0 1 500 65 Z"
    fill="url(#rojoBrillo)"
    stroke="#560000"
    stroke-width="8"/>


<!-- nombres rojos -->

<g
    fill="#fff"
    font-family="Arial Black,Arial"
    font-weight="900"
    font-size="54"
    stroke="#680000"
    stroke-width="12"
    paint-order="stroke"
    filter="url(#texto3d)"
    text-anchor="middle">

    <!-- TRASPALEO -->

    <text
        x="500"
        y="190">
        Traspaleo
    </text>


    <!-- POLIPASTO 1 -->

    <text
        x="770"
        y="450"
        transform="rotate(72 770 450)">
        Polipasto 1
    </text>


    <!-- PALLETIZADO -->

    <text
        x="690"
        y="760"
        transform="rotate(-42 690 760)">
        Palletizado
    </text>


    <!-- MAPAS -->

    <text
        x="310"
        y="760"
        transform="rotate(42 310 760)">
        Mapas
    </text>


    <!-- POLIPASTO 2 -->

    <text
        x="230"
        y="450"
        transform="rotate(-72 230 450)">
        Polipasto 2
    </text>

</g>

</svg>

</div>


<!-- ==================================================
     CENTRO FIJO
=================================================== -->

<div id="centro">

<div class="pentagono">

    <div class="campo">

        <label>Día:</label>

        <select id="dia">

            <option value="" selected disabled></option>

        </select>

    </div>


    <div class="campo">

        <label>Mes:</label>

        <select id="mes">

            <option value="" selected disabled></option>

            <option>Enero</option>
            <option>Febrero</option>
            <option>Marzo</option>
            <option>Abril</option>
            <option>Mayo</option>
            <option>Junio</option>
            <option>Julio</option>
            <option>Agosto</option>
            <option>Septiembre</option>
            <option>Octubre</option>
            <option>Noviembre</option>
            <option>Diciembre</option>

        </select>

    </div>

</div>

</div>


<!-- ==================================================
     FLECHAS
=================================================== -->

<div class="flecha arriba">▼</div>
<div class="flecha abajo">▲</div>
<div class="flecha izquierda">▶</div>
<div class="flecha derecha">◀</div>

</div>


<script>

/* =====================================================
   DÍAS
===================================================== */

const dia = document.getElementById("dia");

for(let i=1;i<=31;i++){

    const option =
        document.createElement("option");

    option.value=i;
    option.textContent=i;

    dia.appendChild(option);
}


/* =====================================================
   GIRO MANUAL DE LOS ANILLOS
===================================================== */

function hacerGiratorio(elemento){

    let girando=false;
    let ultimoAngulo=0;
    let rotacion=0;


    function angulo(x,y){

        const r =
            elemento.getBoundingClientRect();

        const centroX =
            r.left+r.width/2;

        const centroY =
            r.top+r.height/2;

        return Math.atan2(
            y-centroY,
            x-centroX
        )*180/Math.PI;
    }


    function comenzar(x,y){

        girando=true;

        ultimoAngulo =
            angulo(x,y);

    }


    function mover(x,y){

        if(!girando)return;

        const nuevo =
            angulo(x,y);

        let diferencia =
            nuevo-ultimoAngulo;


        if(diferencia>180)
            diferencia-=360;

        if(diferencia<-180)
            diferencia+=360;


        rotacion+=diferencia;

        ultimoAngulo=nuevo;


        elemento.style.transform =
            `rotate(${rotacion}deg)`;
    }


    function terminar(){

        girando=false;

    }


    /* MOUSE */

    elemento.addEventListener(
        "mousedown",
        e=>{

            e.preventDefault();

            comenzar(
                e.clientX,
                e.clientY
            );

        }
    );


    window.addEventListener(
        "mousemove",
        e=>{

            mover(
                e.clientX,
                e.clientY
            );

        }
    );


    window.addEventListener(
        "mouseup",
        terminar
    );


    /* TOUCH */

    elemento.addEventListener(
        "touchstart",
        e=>{

            const t=e.touches[0];

            comenzar(
                t.clientX,
                t.clientY
            );

        },
        {passive:true}
    );


    window.addEventListener(
        "touchmove",
        e=>{

            if(!girando)return;

            const t=e.touches[0];

            mover(
                t.clientX,
                t.clientY
            );

        },
        {passive:true}
    );


    window.addEventListener(
        "touchend",
        terminar
    );

}


/* =====================================================
   ACTIVAR ANILLOS
===================================================== */

hacerGiratorio(
    document.getElementById("azul")
);

hacerGiratorio(
    document.getElementById("rojo")
);

</script>

</body>
</html>
