<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ruleta 5S Original 3D</title>
<style>
body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
#w{position:relative;width:97vw;height:97vw;max-width:560px;max-height:560px}
.r{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);touch-action:none}
#blue{width:100%;height:100%;z-index:1}
#red{width:65%;height:65%;z-index:2}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38%;height:42%;z-index:10;background:linear-gradient(180deg,#fff9b0 0%,#ffd400 25%,#ffaa00 60%,#ff8c00 100%);clip-path:polygon(50% 0%,96% 36%,78% 100%,22% 100%,4% 36%);border:3px solid #ffe600;box-shadow:0 0 20px gold,inset 0 0 15px rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;justify-content:center}
#c b{font-family:Arial Black;font-size:13px;color:#000;text-shadow:0 1px 0 #fff}
#c select{width:94%;background:#000;color:#fff;border:2px solid #000;border-radius:10px;padding:6px 2px;font-weight:900;font-size:11px;text-align:center;margin:3px 0}
</style>
</head>
<body>
<div id="w">
<div id="blue" class="r"><svg viewBox="0 0 500 500" width="100%" height="100%">
<defs><radialGradient id="bg"><stop offset="0%" stop-color="#1a5cff"/><stop offset="100%" stop-color="#002080"/></radialGradient></defs>
<circle cx="250" cy="250" r="245" fill="none" stroke="#00aaff" stroke-width="8" opacity="0.9" style="filter:drop-shadow(0 0 12px #00aaff)"/>
<circle cx="250" cy="250" r="220" fill="url(#bg)"/>
<g id="bS"></g>
</svg></div>
<div id="red" class="r"><svg viewBox="0 0 320 320" width="100%" height="100%">
<circle cx="160" cy="160" r="148" fill="none" stroke="#ff0000" stroke-width="6" style="filter:drop-shadow(0 0 10px red)"/>
<circle cx="160" cy="160" r="128" fill="#8e0000"/>
<g id="rS"></g>
</svg></div>
<div id="c"><b>📅 Día:</b><select id="dia"><option>Selecciona un día</option></select><b>📅 Mes:</b><select id="mes"><option>Selecciona un mes</option></select></div>
</div>
<script>
const blue=["Vale","Monz","Fer","Omar","Tony"], red=["Traspaleo","Polipasto 1","Palletizado","Mapas","Polipasto2"];
function addLabels(svgId,names,isBlue){
 const g=document.getElementById(svgId), cx=isBlue?250:160, r=isBlue?180:102;
 const sec=360/names.length;
 names.forEach((n,i)=>{
  const ang=i*sec-90, rad=ang*Math.PI/180;
  const x=cx+r*Math.cos(rad), y=cx+r*Math.sin(rad);
  // sector line
  const l1=document.createElementNS("http://www.w3.org/2000/svg","line");
  const a2=ang+sec/2; l1.setAttribute("x1",cx); l1.setAttribute("y1",cx===250?40:35); l1.setAttribute("x2",cx); l1.setAttribute("y2",cx===250?460:285);
  l1.setAttribute("transform",`rotate(${a2} ${cx} ${cx})`); l1.setAttribute("stroke","#000"); l1.setAttribute("stroke-width",isBlue?2:2); l1.setAttribute("opacity","0.6");
  g.appendChild(l1);
  const t=document.createElementNS("http://www.w3.org/2000/svg","text");
  t.setAttribute("x",x); t.setAttribute("y",y); t.setAttribute("text-anchor","middle"); t.setAttribute("dominant-baseline","middle");
  t.setAttribute("transform",`rotate(${ang+90} ${x} ${y})`);
  t.setAttribute("style",isBlue?`font-family:Arial Black;font-size:${n.length>4?32:38}px;fill:#d0f0ff;stroke:#002060;stroke-width:3px;paint-order:stroke;filter:drop-shadow(0 0 4px #00e5ff)`:`font-family:Arial Black;font-size:19px;fill:#fff;stroke:#500;stroke-width:1.5px;paint-order:stroke`);
  t.textContent=n; g.appendChild(t);
  // triangulo
  const trR=isBlue?r-22:r-18, tx=cx+trR*Math.cos(rad), ty=cx+trR*Math.sin(rad);
  const tri=document.createElementNS("http://www.w3.org/2000/svg","path");
  tri.setAttribute("d",`M ${tx-10} ${ty-8} L ${tx+10} ${ty-8} L ${tx} ${ty+8} Z`);
  tri.setAttribute("fill",isBlue?"#00c8ff":"#ff2020"); tri.setAttribute("stroke","#000"); tri.setAttribute("stroke-width","1");
  tri.setAttribute("transform",`rotate(${ang+90} ${tx} ${ty})`); g.appendChild(tri);
 });
}
addLabels("bS",blue,true); addLabels("rS",red,false);
function spin(el){let a=0,sa=0,st=0,d=false;const ga=e=>{const rc=el.getBoundingClientRect(),cx=rc.left+rc.width/2,cy=rc.top+rc.height/2,p=e.touches?e.touches[0]:e;return Math.atan2(p.clientY-cy,p.clientX-cx)*180/Math.PI;};const down=e=>{d=true;st=ga(e);sa=a;};const move=e=>{if(!d)return;e.preventDefault();a=sa+(ga(e)-st);el.style.transform=`translate(-50%,-50%) rotate(${a}deg)`;};el.addEventListener('touchstart',down,{passive:false});el.addEventListener('touchmove',move,{passive:false});el.addEventListener('touchend',()=>d=false);el.addEventListener('mousedown',down);window.addEventListener('mousemove',move);window.addEventListener('mouseup',()=>d=false);}
spin(document.getElementById('blue')); spin(document.getElementById('red'));
const dia=document.getElementById('dia'),mes=document.getElementById('mes');for(let i=1;i<=31;i++){let o=document.createElement('option');o.textContent=i;dia.appendChild(o);}["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"].forEach(m=>{let o=document.createElement('option');o.textContent=m;mes.appendChild(o);});
</script>
</body>
</html>
